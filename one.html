
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneJSONFile API Test</title>
<style>
body{font:16px system-ui;padding:20px;max-width:500px;margin:auto}
button{padding:14px;width:100%;margin:8px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:12px}
</style>
</head>
<body>
<h2>OneJSONFile connection test</h2>
<button onclick="testAPI()">Test connection and create file</button>
<pre id="result">Waiting...</pre>

<script>
async function testAPI(){
 const out=document.getElementById("result");
 out.textContent="Testing...";
 try{
  const r=await fetch("https://onejsonfile.com/api/v1/anonymous",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({content:{test:true}})
  });
  const body=await r.text();
  out.textContent="HTTP status: "+r.status+
    "\nResponse:\n"+body;
 }catch(e){
  out.textContent="Browser error: "+e.name+
    "\n"+e.message+
    "\n\nPossible causes: CORS, network, or server failure.";
 }
}
</script>
</body>
</html>
